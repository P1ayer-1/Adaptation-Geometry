# Real-model dry run before renting a GPU (README "Dry run"). Checks: no OOM, ΔW check passes,
# direct LoRA improves tasks, and how long training / evaluation take. Results are NOT evidence
# for or against the hypothesis (one seed, two tiny bases, fitted maps see only 2 tasks).
name: dev_3080
bases:
  - ../bases/dev_qwen2.5-0.5b.yaml
  - ../bases/dev_llama3.2-1b.yaml
tasks:
  - ../tasks/T1_sentiment.yaml   # classification (label scoring)
  - ../tasks/T4_json.yaml        # generation
  - ../tasks/T8_arithmetic.yaml  # generation
lora: ../lora/r16.yaml
train: ../train/dev_3080.yaml
seeds: [0]
splits:
  - {split_id: dev_holdout_T8, holdout: [T8_arithmetic]}
maps:
  methods: [svd_procrustes, identity, random]
  k: 16
gate:
  primary_method: svd_procrustes
  learned_methods: [svd_procrustes]
  non_learned_baselines: [identity, random]
  min_heterogeneous_pairs: 1
  bootstrap_samples: 500
require_pinned_revisions: false
eval_split: test
eval_max_examples: 100
control_tasks: []
alt_templates: []
