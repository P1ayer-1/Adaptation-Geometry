# Crossed task x initialisation test for the universal-subspace note (review item: separate seed
# from task). Same tasks, data and optimiser as dev_a100_v2 (independent inits, A100); this arm:
# each (task, seed) gets its own random A (init_seed_scope: task); checks that 3080 vs A100 training does not change the geometry. Qwen2.5-0.5B on the RTX 3080, dev_3080_es = dev_gpu_es with micro-batch 2 x accum 8.
name: dev_3080_crossed_indep
bases:
  - ../bases/dev_qwen2.5-0.5b.yaml
tasks:
  - ../tasks/v2/T3_paraphrase.yaml
  - ../tasks/v2/T8_arithmetic.yaml
lora: {rank: 16, alpha: 32, dropout: 0.0, target_modules: [q, k, v, o, up, down, gate], use_rslora: false, init_seed_scope: task}
train: ../train/dev_3080_es.yaml
seeds: [0, 1]
fewshot: {k: 5, seed: 0}
splits:
  - {split_id: dev_holdout_T8, holdout: [T8_arithmetic]}
maps:
  methods: [svd_procrustes, identity, random]
  k: 16
gate:
  primary_method: svd_procrustes
  learned_methods: [svd_procrustes]
  non_learned_baselines: [identity, random]
  baseline: fewshot
  min_heterogeneous_pairs: 1
  bootstrap_samples: 500
require_pinned_revisions: false
eval_split: test
eval_max_examples: 200
control_tasks: []
alt_templates: []
