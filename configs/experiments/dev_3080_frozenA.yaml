# Frozen-A test (local RTX 3080): does one fixed A per base make held-out transfer possible?
# 2 bases x 6 tasks x 2 seeds = 24 runs; maps fitted on T3/T7/T9/T10, predicting T4 and T8.
# Compare with dev_a100_v2_cmp (same tasks, split and baselines; trainable A, per-task init).
name: dev_3080_frozenA
bases:
  - ../bases/dev_qwen2.5-0.5b.yaml
  - ../bases/dev_llama3.2-1b.yaml
tasks:
  - ../tasks/v2/T3_paraphrase.yaml   # map training tasks: T3, T7, T9, T10 (learned reliably in the dry run)
  - ../tasks/v2/T7_python.yaml
  - ../tasks/v2/T9_clinical.yaml
  - ../tasks/v2/T10_format.yaml
  - ../tasks/v2/T4_json.yaml         # held out
  - ../tasks/v2/T8_arithmetic.yaml   # held out
lora: ../lora/r16_frozenA.yaml
train: ../train/dev_3080_cmp.yaml
seeds: [0, 1]
fewshot: {k: 5, seed: 0}
splits:
  - {split_id: holdout_T4_T8, holdout: [T4_json, T8_arithmetic]}
maps:
  methods: [svd_procrustes, svd_linear, random, random_coords, target_mean]
  k: 16
gate:
  primary_method: svd_procrustes
  learned_methods: [svd_procrustes, svd_linear]
  non_learned_baselines: [random, random_coords, target_mean]
  baseline: fewshot
  min_heterogeneous_pairs: 1
  bootstrap_samples: 1000
require_pinned_revisions: false
eval_split: test
eval_max_examples: 200
control_tasks: []
alt_templates: []
