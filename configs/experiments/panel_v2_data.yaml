# Holds the v2 task panel so `uag make-data` can write its manifests; also used by the
# few-shot calibration check (uag eval --stage base). Not a training experiment.
name: panel_v2_calibration
bases:
  - ../bases/dev_qwen2.5-0.5b.yaml
  - ../bases/dev_llama3.2-1b.yaml
tasks:
  - ../tasks/v2/T1_hidden_rule.yaml
  - ../tasks/v2/T2_nli.yaml
  - ../tasks/v2/T3_paraphrase.yaml
  - ../tasks/v2/T4_json.yaml
  - ../tasks/v2/T5_concise.yaml
  - ../tasks/v2/T6_verbose.yaml
  - ../tasks/v2/T7_python.yaml
  - ../tasks/v2/T8_arithmetic.yaml
  - ../tasks/v2/T9_clinical.yaml
  - ../tasks/v2/T10_format.yaml
lora: ../lora/r16.yaml
train: ../train/dev_3080.yaml
seeds: [0]
splits: []
gate: {min_heterogeneous_pairs: 1}
require_pinned_revisions: false
eval_split: valid         # calibration never looks at test data
eval_max_examples: 100
