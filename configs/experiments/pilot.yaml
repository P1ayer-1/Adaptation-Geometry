# Task-panel pilot (spec §17, days 3-5): one seed per base × task to verify measurable
# direct-LoRA lift and metric reliability before the Stage-0 grid is frozen. No maps.
name: pilot
bases:
  - ../bases/stage0_A1_qwen2.5-1.5b.yaml
  - ../bases/stage0_A2_qwen2.5-3b.yaml
  - ../bases/stage0_B_llama3.2-3b.yaml
  - ../bases/stage0_C_gemma2-2b.yaml
# Task panel v2 (configs/tasks/v2): v1 was at ceiling or format-dominated for 0.5-1B bases.
tasks:
  - ../tasks/v2/T1_hidden_rule.yaml
  - ../tasks/v2/T2_nli.yaml
  - ../tasks/v2/T3_paraphrase.yaml
  - ../tasks/v2/T4_json.yaml
  - ../tasks/v2/T5_concise.yaml
  - ../tasks/v2/T6_verbose.yaml
  - ../tasks/v2/T7_python.yaml
  - ../tasks/v2/T8_arithmetic.yaml
  - ../tasks/v2/T9_clinical.yaml
  - ../tasks/v2/T10_format.yaml
lora: ../lora/r16_frozenA.yaml   # one fixed A per base (dev runs: same learning, seeds agree 0.92 vs 0.08)
train: ../train/stage0.yaml
seeds: [0]
splits: []
require_pinned_revisions: true
eval_split: valid        # the pilot never looks at test data
eval_max_examples: 200
