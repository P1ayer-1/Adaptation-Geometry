# 2 bases × 2 transformations × 2 seeds smoke test (spec §20 step 6) + toy held-out test (step 8):
# maps are fitted on one transformation and predict the other. Pipeline validation only.
name: smoke
bases:
  - ../bases/tiny_llama_a1.yaml
  - ../bases/tiny_qwen2_b.yaml
tasks:
  - ../tasks/T1_sentiment.yaml
  - ../tasks/T3_paraphrase.yaml
lora: {rank: 4, alpha: 8, dropout: 0.0, target_modules: [q, k, v, o, up, down, gate]}
train: ../train/smoke.yaml
seeds: [0, 1]
splits:
  - {split_id: toy_fitT1_predT3, holdout: [T3_paraphrase]}
  - {split_id: toy_fitT3_predT1, holdout: [T1_sentiment]}
maps:
  methods: [svd_procrustes, svd_linear, procrustes_full, identity, cross_lora, random]
  k: 4
gate:
  primary_method: svd_procrustes
  learned_methods: [svd_procrustes, svd_linear, procrustes_full]
  non_learned_baselines: [identity, cross_lora, random]
  min_direct_lift: 0.02
  bootstrap_samples: 500
require_pinned_revisions: false
eval_split: test
eval_max_examples: 200
control_tasks: []
alt_templates: [v1-alt]
