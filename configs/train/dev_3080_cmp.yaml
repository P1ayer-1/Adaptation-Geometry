# Same optimisation and early-stopping settings as dev_gpu_es.yaml (the v2 dry run), so frozen-A
# runs on the 8 GB RTX 3080 compare with the trainable-A dry run. Only memory settings differ:
# micro-batch 4 x accumulation 4 (same effective batch of 16) and gradient checkpointing.
learning_rate: 2.0e-4
batch_size: 4
grad_accum: 4
max_tokens_seen: 1500000
max_seq_len: 512
warmup_ratio: 0.03
eval_every_steps: 25
selection_metric: valid_primary
valid_max_examples: 64
early_stopping_patience: 4
early_stopping_min_delta: 0.005
min_steps: 150
dtype: bfloat16
deterministic: true
device: auto
gradient_checkpointing: true
