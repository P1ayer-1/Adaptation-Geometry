# 8 GB dev GPU with early stopping (v2 dry run). Effective batch = 2 x 8 = 16 sequences, as in
# dev_3080.yaml. Checkpoints are selected on the validation *task metric* (the loss hits ~0 long
# before the metric stops moving), and training stops after 4 validations (4 x 25 steps) without
# a gain > 0.005, never before step 150. The cap is generous on purpose: this run measures the
# learning curves that set the Stage-0 caps (`uag learning-curves`).
learning_rate: 2.0e-4
batch_size: 2
grad_accum: 8
max_tokens_seen: 1500000
max_seq_len: 512
warmup_ratio: 0.03
eval_every_steps: 25
selection_metric: valid_primary
valid_max_examples: 64
early_stopping_patience: 4
early_stopping_min_delta: 0.005
min_steps: 150
dtype: bfloat16
deterministic: true
device: auto
gradient_checkpointing: true
