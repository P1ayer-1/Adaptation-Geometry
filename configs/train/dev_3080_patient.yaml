# Patience test: dev_3080_cmp.yaml with stopping allowed only after one full pass over the
# training data and 8 validations (200 steps) without improvement.
learning_rate: 2.0e-4
batch_size: 4
grad_accum: 4
max_tokens_seen: 1500000
max_seq_len: 512
warmup_ratio: 0.03
eval_every_steps: 25
selection_metric: valid_primary
valid_max_examples: 64
early_stopping_patience: 8
early_stopping_min_delta: 0.005
min_steps: 150
dtype: bfloat16
deterministic: true
device: auto
gradient_checkpointing: true
min_epochs: 1.0
