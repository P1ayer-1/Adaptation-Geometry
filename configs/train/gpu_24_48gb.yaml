# Stage-0-sized training on a rented 24-48 GB GPU (A40 / A6000 / L40S / A100-40 / H100).
# Same effective batch as the dev config (16 sequences) and the same optimiser, so runs are
# comparable; only the memory/speed trade-offs differ: larger micro-batch, fewer accumulation
# steps, no gradient checkpointing. Early stopping + per-task cap: see src/uag/budget.py and
# README "Token budget". Replace max_tokens_seen with the pilot's proposed cap.
learning_rate: 2.0e-4
weight_decay: 0.0
batch_size: 8
grad_accum: 2
max_tokens_seen: 2000000
max_seq_len: 512
warmup_ratio: 0.03
eval_every_steps: 50
selection_metric: valid_primary
valid_max_examples: 128
early_stopping_patience: 4
early_stopping_min_delta: 0.005
min_steps: 150
optimizer: adamw
dtype: bfloat16
deterministic: true
device: auto
gradient_checkpointing: false
